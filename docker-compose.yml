version: '2.2'

services:
  web:
    container_name: BasicPortfolio
    build: 
      context: .
      dockerfile: .docker/Dockerfile.dev
    command: sh -c "rm -f .astro/dev.json && npm run dev"
    ports:
      - 4321:4321
    networks:
      - overlay
    volumes:
      - .:/app
      - /app/node_modules

networks:
  overlay:
